<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Love</title>

    <link type="text/css" rel="stylesheet" href="./Love_files/default.css">
    <script type="text/javascript" src="./Love_files/jquery.min.js"></script>
    <script type="text/javascript" src="./Love_files/jscex.min.js"></script>
    <script type="text/javascript" src="./Love_files/jscex-parser.js"></script>
    <script type="text/javascript" src="./Love_files/jscex-jit.js"></script>
    <script type="text/javascript" src="./Love_files/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./Love_files/jscex-async.min.js"></script>
    <script type="text/javascript" src="./Love_files/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./Love_files/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./Love_files/love.js" charset="utf-8"></script>

    <style>
        #start-hint {
            position: fixed;
            bottom: 500px;
            width: 100%;
            text-align: center;
            color: rgba(8, 8, 8, 0.85);
            font-size: 20px;
            z-index: 9999;
            pointer-events: none;
            /* 不阻挡点击 */
            animation: fadeIn 2s ease-out;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="start-hint">点击屏幕，开启我们的故事 🎵</div>
    <div id="main">
        <div id="error">亲，您使用的浏览器无法支持即将显示的内容，请换成谷歌(<a
                href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a>)或者火狐(<a
                href="http://firefox.com.cn/download/">Firefox</a>)浏览器哟~</div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <span class="say">缘起最右，相逢有幸。</span><br>
                    <span class="say">开始是在最右偶然刷到你，</span><br>
                    <span class="say">原本只是萍水相逢的陌生人，</span><br>
                    <span class="say">随口聊了几句之后互加微信，</span><br>
                    <span class="say">谁都没有料到，这一认识，</span><br>
                    <span class="say">就慢慢占据了我全部的日常。</span><br>
                    <span class="say">最起初只是闲来无事的闲聊，</span><br>
                    <span class="say">分享零散的趣事，</span><br>
                    <span class="say">慢慢变成晨起第一句早安，</span><br>
                    <span class="say">睡前不间断的碎碎念。</span><br>
                    <span class="say">我会随手拍下路边的风景，</span><br>
                    <span class="say">吃到的美食下意识分享给你，</span><br>
                    <span class="say">遇到委屈或者开心的小事，</span><br>
                    <span class="say">第一个想要倾诉的人也是你。</span><br>
                    <br>

                </div>
            </div>
            <div id="clock-box">
                <a target="_blank">小飞</a> 与 <a target="_blank">小婧</a> 认识的
                <a href="page2.html" id="treeLink" class="heart-btn" title="点击继续"></a>
                <div id="clock"></div>
            </div>
            <canvas id="canvas"></canvas>
            <style>
                .heart-btn {
                    display: inline-block;
                    width: 24px;
                    height: 24px;
                    cursor: pointer;
                    animation: heartbeat 1.5s ease-in-out infinite;
                    margin-left: 8px;
                    vertical-align: middle;
                }

                .heart-btn::before,
                .heart-btn::after {
                    content: "";
                    position: absolute;
                    top: 0;
                    width: 16px;
                    height: 24px;
                    background: #ff4757;
                    border-radius: 16px 16px 0 0;
                }

                .heart-btn::before {
                    left: 12px;
                    transform: rotate(-45deg);
                    transform-origin: 0 100%;
                }

                .heart-btn::after {
                    left: 0;
                    transform: rotate(45deg);
                    transform-origin: 100% 100%;
                }

                @keyframes heartbeat {

                    0%,
                    100% {
                        transform: scale(1);
                    }

                    50% {
                        transform: scale(1.1);
                    }
                }
            </style>
        </div>
        <audio id="bgMusic" src="love.mp3" loop="loop" preload="auto">
    </div>

    <script>
        function playMusic() {
            var audio = document.getElementById('bgMusic');
            if (audio) {
                audio.play().catch(function (err) {
                    console.log('Audio play failed:', err);
                });
            }
        }

        function hideHint() {
            var hint = document.getElementById('start-hint');
            if (hint) {
                hint.style.transition = 'opacity 0.8s ease';
                hint.style.opacity = '0';
                setTimeout(function () {
                    hint.style.display = 'none';
                }, 800);
            }
        }

        document.addEventListener('click', function () {
            playMusic();
            hideHint();
        }, { once: true });

        document.addEventListener('touchstart', function (e) {
            e.preventDefault();
            playMusic();
            hideHint();
        }, { once: true });
    </script>

    <script>
    </script>

    <script>
        (function () {
            var canvas = $('#canvas');

            if (!canvas[0].getContext) {
                $("#error").show();
                return false;
            }

            var container = $('#wrap');
            var width = Math.min(container.width(), 1100);
            var height = Math.round(width * 680 / 1100);
            
            canvas.attr("width", width);
            canvas.attr("height", height);
            canvas.css("width", width + "px");
            canvas.css("height", height + "px");

            var scaleRatio = width / 1100;
            
            var opts = {
                seed: {
                    x: width / 2 - 20,
                    color: "rgb(190, 26, 37)",
                    scale: 2 * scaleRatio
                },
                branch: [
                    [535 * scaleRatio, height, 570 * scaleRatio, 250 * scaleRatio, 500 * scaleRatio, 200 * scaleRatio, 30 * scaleRatio, 100, [
                        [540 * scaleRatio, 500 * scaleRatio, 455 * scaleRatio, 417 * scaleRatio, 340 * scaleRatio, 400 * scaleRatio, 13 * scaleRatio, 100, [
                            [450 * scaleRatio, 435 * scaleRatio, 434 * scaleRatio, 430 * scaleRatio, 394 * scaleRatio, 395 * scaleRatio, 2 * scaleRatio, 40]
                        ]],
                        [550 * scaleRatio, 445 * scaleRatio, 600 * scaleRatio, 356 * scaleRatio, 680 * scaleRatio, 345 * scaleRatio, 12 * scaleRatio, 100, [
                            [578 * scaleRatio, 400 * scaleRatio, 648 * scaleRatio, 409 * scaleRatio, 661 * scaleRatio, 426 * scaleRatio, 3 * scaleRatio, 80]
                        ]],
                        [539 * scaleRatio, 281 * scaleRatio, 537 * scaleRatio, 248 * scaleRatio, 534 * scaleRatio, 217 * scaleRatio, 3 * scaleRatio, 40],
                        [546 * scaleRatio, 397 * scaleRatio, 413 * scaleRatio, 247 * scaleRatio, 328 * scaleRatio, 244 * scaleRatio, 9 * scaleRatio, 80, [
                            [427 * scaleRatio, 286 * scaleRatio, 383 * scaleRatio, 253 * scaleRatio, 371 * scaleRatio, 205 * scaleRatio, 2 * scaleRatio, 40],
                            [498 * scaleRatio, 345 * scaleRatio, 435 * scaleRatio, 315 * scaleRatio, 395 * scaleRatio, 330 * scaleRatio, 4 * scaleRatio, 60]
                        ]],
                        [546 * scaleRatio, 357 * scaleRatio, 608 * scaleRatio, 252 * scaleRatio, 678 * scaleRatio, 221 * scaleRatio, 6 * scaleRatio, 100, [
                            [590 * scaleRatio, 293 * scaleRatio, 646 * scaleRatio, 277 * scaleRatio, 648 * scaleRatio, 271 * scaleRatio, 2 * scaleRatio, 80]
                        ]]
                    ]]
                ],
                bloom: {
                    num: Math.round(700 * scaleRatio),
                    width: width,
                    height: height,
                },
                footer: {
                    width: width + 100,
                    height: 5 * scaleRatio,
                    speed: 10,
                }
            }

            var tree = new Tree(canvas[0], width, height, opts);
            var seed = tree.seed;
            var foot = tree.footer;
            var hold = 1;

            canvas.click(function (e) {
                handleInteraction(e);
            }).mousemove(function (e) {
                var offset = canvas.offset(), x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                canvas.toggleClass('hand', seed.hover(x, y));
            }).on('touchstart', function (e) {
                e.preventDefault();
                handleInteraction(e);
            }).on('touchmove', function (e) {
                e.preventDefault();
                var touch = e.touches[0];
                var offset = canvas.offset(), x, y;
                x = touch.pageX - offset.left;
                y = touch.pageY - offset.top;
                canvas.toggleClass('hand', seed.hover(x, y));
            });

            function handleInteraction(e) {
                var offset = canvas.offset(), x, y;
                if (e.touches && e.touches.length > 0) {
                    x = e.touches[0].pageX - offset.left;
                    y = e.touches[0].pageY - offset.top;
                } else {
                    x = e.pageX - offset.left;
                    y = e.pageY - offset.top;
                }
                if (seed.hover(x, y)) {
                    hold = 0;
                    canvas.unbind("click");
                    canvas.unbind("mousemove");
                    canvas.off('touchstart');
                    canvas.off('touchmove');
                    canvas.removeClass('hand');
                }
            }

            var seedAnimate = eval(Jscex.compile("async", function () {
                seed.draw();
                while (hold) {
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canScale()) {
                    seed.scale(0.95);
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canMove()) {
                    seed.move(0, 2);
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
            }));

            var growAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.grow();
                    $await(Jscex.Async.sleep(10));
                } while (tree.canGrow());
            }));

            var flowAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.flower(2);
                    $await(Jscex.Async.sleep(10));
                } while (tree.canFlower());
            }));

            var moveAnimate = eval(Jscex.compile("async", function () {
                var snapX = Math.round(240 * scaleRatio);
                var snapWidth = Math.round(610 * scaleRatio);
                var snapHeight = height;
                var snapTargetX = Math.round(500 * scaleRatio);
                
                tree.snapshot("p1", snapX, 0, snapWidth, snapHeight);
                while (tree.move("p1", snapTargetX, 0)) {
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
                foot.draw();
                tree.snapshot("p2", snapTargetX, 0, snapWidth, snapHeight);

                // 会有闪烁不得意这样做, (＞﹏＜)
                canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
                canvas.css("background", "#ffe");
                $await(Jscex.Async.sleep(300));
                canvas.css("background", "none");
            }));

            var jumpAnimate = eval(Jscex.compile("async", function () {
                var ctx = tree.ctx;
                while (true) {
                    tree.ctx.clearRect(0, 0, width, height);
                    tree.jump();
                    foot.draw();
                    $await(Jscex.Async.sleep(25));
                }
            }));
            
            $(window).resize(function() {
                var newWidth = Math.min(container.width(), 1100);
                var newHeight = Math.round(newWidth * 680 / 1100);
                if (newWidth !== width) {
                    location.replace(location);
                }
            });

            var textAnimate = eval(Jscex.compile("async", function () {
                var together = new Date();
                together.setFullYear(2026, 3, 7);  // 2023年6月20日（示例日期）
                together.setHours(13);
                together.setMinutes(14);
                together.setSeconds(0);
                together.setMilliseconds(0);

                $("#code").show().typewriter();
                $("#clock-box").fadeIn(500);
                while (true) {
                    timeElapse(together);
                    $await(Jscex.Async.sleep(1000));
                }
            }));

            var runAsync = eval(Jscex.compile("async", function () {
                $await(seedAnimate());
                $await(growAnimate());
                $await(flowAnimate());
                $await(moveAnimate());

                textAnimate().start();

                $await(jumpAnimate());
            }));

            runAsync().start();
        })();
    </script>



</body>

</html>
