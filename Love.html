    <link type="text/css" rel="stylesheet" href="./Love_files/default.css">

    <style>
        #start-hint {
            position: fixed;
            bottom: 500px;
            width: 100%;
            text-align: center;
            color: rgba(8, 8, 8, 0.85);
            font-size: 20px;
            z-index: 9999;
            pointer-events: none;
            /* 不阻挡点击 */
            animation: fadeIn 2s ease-out;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

<body>
    <div id="start-hint">点击屏幕，开启我们的故事 🎵</div>
    <div id="main">
        <div id="error">亲，您使用的浏览器无法支持即将显示的内容，请换成谷歌(<a
                href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a>)或者火狐(<a
                href="http://firefox.com.cn/download/">Firefox</a>)浏览器哟~</div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <span class="say">缘起最右，相逢有幸。</span><br>
                    <span class="say">开始是在最右偶然刷到你，</span><br>
                    <span class="say">原本只是萍水相逢的陌生人，</span><br>
                    <span class="say">随口聊了几句之后互加微信，</span><br>
                    <span class="say">谁都没有料到，这一认识，</span><br>
                    <span class="say">就慢慢占据了我全部的日常。</span><br>
                    <span class="say">最起初只是闲来无事的闲聊，</span><br>
                    <span class="say">分享零散的趣事，</span><br>
                    <span class="say">慢慢变成晨起第一句早安，</span><br>
                    <span class="say">睡前不间断的碎碎念。</span><br>
                    <span class="say">我会随手拍下路边的风景，</span><br>
                    <span class="say">吃到的美食下意识分享给你，</span><br>
                    <span class="say">遇到委屈或者开心的小事，</span><br>
                    <span class="say">第一个想要倾诉的人也是你。</span><br>
                    <br>

                </div>
            </div>
            <div id="clock-box">
                <a target="_blank">小飞</a> 与 <a target="_blank">小婧</a> 认识的
                <a href="page2.html" id="treeLink" class="heart-btn" title="点击继续"></a>
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
            <style>
                .heart-btn {
                    display: inline-block;
                    width: 24px;
                    height: 24px;
                    cursor: pointer;
                    animation: heartbeat 1.5s ease-in-out infinite;
                    margin-left: 8px;
                    vertical-align: middle;
                }

                .heart-btn::before,
                .heart-btn::after {
                    content: "";
                    position: absolute;
                    top: 0;
                    width: 16px;
                    height: 24px;
                    background: #ff4757;
                    border-radius: 16px 16px 0 0;
                }

                .heart-btn::before {
                    left: 12px;
                    transform: rotate(-45deg);
                    transform-origin: 0 100%;
                }

                .heart-btn::after {
                    left: 0;
                    transform: rotate(45deg);
                    transform-origin: 100% 100%;
                }

                @keyframes heartbeat {

                    0%,
                    100% {
                        transform: scale(1);
                    }

                    50% {
                        transform: scale(1.1);
                    }
                }
            </style>
        </div>
        <audio id="bgMusic" src="love.mp3" loop="loop"></audio>
    </div>

    <script>
        document.addEventListener('click', function () {
            var audio = document.getElementById('bgMusic');
            audio.play().catch(function () { });

            // 点击后提示慢慢消失
            var hint = document.getElementById('start-hint');
            if (hint) {
                hint.style.transition = 'opacity 0.8s ease';
                hint.style.opacity = '0';
                setTimeout(function () {
                    hint.style.display = 'none';
                }, 800);
            }
        }, { once: true });
    </script>

    <script>
    </script>

    <script>
        (function () {
            var canvas = $('#canvas');

            if (!canvas[0].getContext) {
                $("#error").show();
                return false;
            }

            var width = canvas.width();
            var height = canvas.height();

            canvas.attr("width", width);
            canvas.attr("height", height);

            var opts = {
                seed: {
                    x: width / 2 - 20,
                    color: "rgb(190, 26, 37)",
                    scale: 2
                },
                branch: [
                    [535, 680, 570, 250, 500, 200, 30, 100, [
                        [540, 500, 455, 417, 340, 400, 13, 100, [
                            [450, 435, 434, 430, 394, 395, 2, 40]
                        ]],
                        [550, 445, 600, 356, 680, 345, 12, 100, [
                            [578, 400, 648, 409, 661, 426, 3, 80]
                        ]],
                        [539, 281, 537, 248, 534, 217, 3, 40],
                        [546, 397, 413, 247, 328, 244, 9, 80, [
                            [427, 286, 383, 253, 371, 205, 2, 40],
                            [498, 345, 435, 315, 395, 330, 4, 60]
                        ]],
                        [546, 357, 608, 252, 678, 221, 6, 100, [
                            [590, 293, 646, 277, 648, 271, 2, 80]
                        ]]
                    ]]
                ],
                bloom: {
                    num: 700,
                    width: 1080,
                    height: 650,
                },
                footer: {
                    width: 1200,
                    height: 5,
                    speed: 10,
                }
            }

            var tree = new Tree(canvas[0], width, height, opts);
            var seed = tree.seed;
            var foot = tree.footer;
            var hold = 1;

            canvas.click(function (e) {
                var offset = canvas.offset(), x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                if (seed.hover(x, y)) {
                    hold = 0;
                    canvas.unbind("click");
                    canvas.unbind("mousemove");
                    canvas.removeClass('hand');
                }
            }).mousemove(function (e) {
                var offset = canvas.offset(), x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                canvas.toggleClass('hand', seed.hover(x, y));
            });

            var seedAnimate = eval(Jscex.compile("async", function () {
                seed.draw();
                while (hold) {
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canScale()) {
                    seed.scale(0.95);
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canMove()) {
                    seed.move(0, 2);
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
            }));

            var growAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.grow();
                    $await(Jscex.Async.sleep(10));
                } while (tree.canGrow());
            }));

            var flowAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.flower(2);
                    $await(Jscex.Async.sleep(10));
                } while (tree.canFlower());
            }));

            var moveAnimate = eval(Jscex.compile("async", function () {
                tree.snapshot("p1", 240, 0, 610, 680);
                while (tree.move("p1", 500, 0)) {
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
                foot.draw();
                tree.snapshot("p2", 500, 0, 610, 680);

                // 会有闪烁不得意这样做, (＞﹏＜)
                canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
                canvas.css("background", "#ffe");
                $await(Jscex.Async.sleep(300));
                canvas.css("background", "none");
            }));

            var jumpAnimate = eval(Jscex.compile("async", function () {
                var ctx = tree.ctx;
                while (true) {
                    tree.ctx.clearRect(0, 0, width, height);
                    tree.jump();
                    foot.draw();
                    $await(Jscex.Async.sleep(25));
                }
            }));

            var textAnimate = eval(Jscex.compile("async", function () {
                var together = new Date();
                together.setFullYear(2026, 3, 7);  // 2023年6月20日（示例日期）
                together.setHours(13);
                together.setMinutes(14);
                together.setSeconds(0);
                together.setMilliseconds(0);

                $("#code").show().typewriter();
                $("#clock-box").fadeIn(500);
                while (true) {
                    timeElapse(together);
                    $await(Jscex.Async.sleep(1000));
                }
            }));

            var runAsync = eval(Jscex.compile("async", function () {
                $await(seedAnimate());
                $await(growAnimate());
                $await(flowAnimate());
                $await(moveAnimate());

                textAnimate().start();

                $await(jumpAnimate());
            }));

            runAsync().start();
        })();
    </script>



</body>

</html>
