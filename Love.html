<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Love</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ffe; min-height: 100vh; overflow: hidden; }
        #wrap { position: relative; width: 100%; height: 100vh; }
        #canvas { display: block; width: 100%; height: 100%; }
        #start-hint {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: rgba(190, 26, 37, 0.9);
            font-size: 18px; z-index: 9999;
            animation: pulse 2s ease-in-out infinite;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            letter-spacing: 3px;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }
        #content { display: none; position: relative; z-index: 10; }
        #text { padding: 20px; color: #333; font-size: 14px; line-height: 2; }
        .heart { color: #ff4757; }
        #clock-box { text-align: center; padding: 10px; color: #666; font-size: 14px; }
        #clock { font-weight: bold; color: #ff4757; }
        .heart-btn {
            display: inline-block; width: 20px; height: 20px;
            position: relative; margin: 0 5px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        .heart-btn::before, .heart-btn::after {
            content: ''; position: absolute; top: 0;
            width: 12px; height: 20px; background: #ff4757;
            border-radius: 12px 12px 0 0;
        }
        .heart-btn::before { left: 10px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .heart-btn::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="start-hint">💕 点击屏幕，开启我们的故事 🎵</div>
        <canvas id="canvas"></canvas>
        <div id="content">
            <div id="text">
                <p class="heart">缘起最右，相逢有幸。</p>
                <p>开始是在最右偶然刷到你，</p>
                <p>原本只是萍水相逢的陌生人，</p>
                <p>随口聊了几句之后互加微信，</p>
                <p>谁都没有料到，这一认识，</p>
                <p>就慢慢占据了我全部的日常。</p>
                <p>最起初只是闲来无事的闲聊，</p>
                <p>分享零散的趣事，</p>
                <p>慢慢变成晨起第一句早安，</p>
                <p>睡前不间断的碎碎念。</p>
                <p>我会随手拍下路边的风景，</p>
                <p>吃到的美食下意识分享给你，</p>
                <p>遇到委屈或者开心的小事，</p>
                <p class="heart">第一个想要倾诉的人也是你。</p>
            </div>
            <div id="clock-box">
                <span>小飞</span> 与 <span>小婧</span> 认识的
                <span class="heart-btn"></span>
                <span id="clock"></span>
            </div>
        </div>
    </div>
    <audio id="bgMusic" src="love.mp3" loop preload="auto"></audio>

    <script>
        var canvas, ctx, width, height, particles = [];
        var isStarted = false;
        var startTime;

        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resize();
            window.addEventListener('resize', resize);
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createHeart(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(20, -20, 40, 0, 0, 30);
            ctx.bezierCurveTo(-40, 0, -20, -20, 0, 0);
            ctx.fill();
            ctx.restore();
        }

        function createParticle() {
            return {
                x: width / 2 + (Math.random() - 0.5) * 100,
                y: height / 2 + (Math.random() - 0.5) * 100,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2 - 1,
                scale: Math.random() * 0.5 + 0.2,
                alpha: 1,
                decay: Math.random() * 0.01 + 0.005
            };
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            var time = Date.now() - startTime;
            
            if (time < 2000) {
                var scale = Math.min(time / 500, 2);
                createHeart(width / 2, height / 2, scale);
            } else {
                for (var i = particles.length - 1; i >= 0; i--) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.02;
                    p.alpha -= p.decay;
                    
                    if (p.alpha > 0) {
                        ctx.globalAlpha = p.alpha;
                        createHeart(p.x, p.y, p.scale);
                    } else {
                        particles.splice(i, 1);
                    }
                }
                
                if (Math.random() < 0.3) {
                    particles.push(createParticle());
                }
            }
            
            ctx.globalAlpha = 1;
            requestAnimationFrame(animate);
        }

        function timeElapse(start) {
            var now = new Date();
            var diff = now - start;
            var days = Math.floor(diff / (1000 * 60 * 60 * 24));
            var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('clock').textContent = days + '天' + hours + '时' + minutes + '分' + seconds + '秒';
        }

        function start() {
            if (isStarted) return;
            isStarted = true;
            
            document.getElementById('start-hint').style.display = 'none';
            
            var audio = document.getElementById('audio') || document.createElement('audio');
            audio.id = 'audio';
            audio.src = 'love.mp3';
            audio.loop = true;
            audio.play().catch(function() {});
            
            startTime = Date.now();
            animate();
            
            setTimeout(function() {
                document.getElementById('content').style.display = 'block';
                var together = new Date(2026, 2, 7, 13, 14, 0);
                timeElapse(together);
                setInterval(function() { timeElapse(together); }, 1000);
            }, 2500);
        }

        init();
        document.addEventListener('click', start);
        document.addEventListener('touchstart', function(e) { e.preventDefault(); start(); }, { passive: false });
    </script>
</body>
</html>
